[package]
name = "ve-cli"
description = "The ve binary: a thin client, one subcommand per protocol method."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ve-protocol.workspace = true
ve-model.workspace = true
ve-daemon.workspace = true
ve-plugin.workspace = true
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio.workspace = true
interprocess.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# The workspace lints, except unsafe_code is `deny` rather than `forbid` so
# src/stdio.rs can allow its one Windows call. Keep in sync with the root.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bin]]
name = "ve"
path = "src/main.rs"

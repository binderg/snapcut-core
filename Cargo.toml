[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "TBD" # open decision: MIT/Apache-2.0 vs MPL/AGPL
publish = false

# Every third-party version is pinned here, once. Member crates inherit with
# `foo.workspace = true`. Versions are the latest on crates.io as of 2026-10-21.
# Entries tagged (Phase N) are declared but not used by any member yet.
[workspace.dependencies]
# --- internal ---
ve-model = { path = "crates/ve-model" }
ve-ops = { path = "crates/ve-ops" }
ve-history = { path = "crates/ve-history" }
ve-media = { path = "crates/ve-media" }
ve-render = { path = "crates/ve-render" }
ve-export = { path = "crates/ve-export" }
ve-analyze = { path = "crates/ve-analyze" }
ve-plugin = { path = "crates/ve-plugin" }
ve-protocol = { path = "crates/ve-protocol" }
ve-daemon = { path = "crates/ve-daemon" }

# --- model and protocol ---
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: exact text <-> f64, which exact rational time depends on (OTIO
# writes times as doubles; see ve-model::time).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
num-rational = { version = "0.4.2", default-features = false, features = ["std", "serde"] }
num-integer = "0.1"
indexmap = { version = "2.14.2", features = ["serde"] }
nanoid = "0.5.0"
semver = { version = "1.0.28", features = ["serde"] }
url = { version = "2.5.8", features = ["serde"] }
json-patch = "4.2.0"
base64 = "0.22.1"
jsonrpsee = { version = "0.26.1", default-features = false }
schemars = "1.2.3"
openrpc-types = "0.5.0"
jsonschema = { version = "0.59.0", default-features = false }
thiserror = "2.0.21"

# --- media and render ---
# download_ffmpeg is off: its auto-download fetches GPL builds. Enable it only
# for local development via ve-media's `download-ffmpeg` feature.
ffmpeg-sidecar = { version = "2.7.0", default-features = false }
blake3 = "1.8.7"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
quick_cache = "0.7.0"
ffmpeg-the-third = "6.0.0"      # (Phase 2) in-process decode
wgpu = "30.0.1"                 # (Phase 2) compositor
naga = "30.0.1"                 # (Phase 2) shader validation, GLSL -> WGSL
naga_oil = "0.23.0"             # (Phase 2) wrapper + author shader composition
glyphon = "0.12.0"              # (Phase 2) caption/title text
cosmic-text = "0.19.0"          # (Phase 2)
palette = "0.7.7"               # (Phase 2) color reference math
symphonia = "0.6.1"             # (Phase 2) audio decode, MPL-2.0
rubato = "5.0.1"                # (Phase 2)
ebur128 = "0.1.10"              # (Phase 2)
cpal = "0.18.2"                 # (Phase 4) playback

# --- runtime, plugins, tooling ---
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
futures = "0.3.34"
interprocess = { version = "2.4.6", features = ["tokio"] }
fs4 = { version = "1.1.0", features = ["sync"] }
notify = "8.2.0"
etcetera = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
keyring = "4.2.0"               # (Phase 3) BYOK secrets for plugins
extism = "1.41.0"               # (later) WASM plugin tier
opendal = "0.59.5"              # (later) s3:// and other media backends

# --- tests ---
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["json"] }
image-compare = "0.5.0"         # golden frames; do NOT use dssim-core (AGPL)

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2 # dependencies (image resize, hashing) are painfully slow unoptimized
